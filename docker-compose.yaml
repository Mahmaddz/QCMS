# version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qcms-password-k3y
      POSTGRES_DB: QCMS
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/restore:/docker-entrypoint-initdb.d
      - ./postgres/backup:/backup
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - "./backend:/app"
      - /app/node_modules
    networks:
      - app-network
    depends_on:
      - sphinx
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    stdin_open: true
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    networks:
      - app-network
    depends_on:
      - backend

  sphinx:
    build:
      context: ./sphinx
      dockerfile: Dockerfile
    container_name: sphinx
    environment:
      - SPHINX_CONFIG_FILE=/opt/sphinx/conf/sphinx_mushaf.conf
    ports:
      - 9306:9306
    volumes:
      - ./sphinx/data:/opt/sphinx/indexes
      - ./sphinx/sphinx_mushaf.conf:/opt/sphinx/conf/sphinx_mushaf.conf
      - ./sphinx/stopwords.txt:/opt/sphinx/conf/stopwords.txt
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  app-network:
    driver: bridge